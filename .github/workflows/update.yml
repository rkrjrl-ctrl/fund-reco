name: update
on:
  schedule:
    - cron: '30 23 * * *'   # 08:30 KST
    - cron: '30 10 * * *'   # 19:30 KST
  workflow_dispatch:
  push:
    paths: [lineup.json, tpl.html, update.js]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: node update.js
        env:
          OUT_DIR: docs
          OUT_NAME: index.html
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs holdings.json
          git diff --cached --quiet || (git commit -m "data update" && git push)
