name: update
on:
  schedule:
    - cron: '30 23 * * *'   # 08:30 KST
    - cron: '30 10 * * *'   # 19:30 KST
  workflow_dispatch:
  push:
    paths: [lineup.json, tpl.html, update.js, metlife.js, pension.js, pension.json, tdf-notes.json, metlife-notes.json, tdf-lookthrough.json]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: node update.js
        env:
          OUT_DIR: docs
          OUT_NAME: index.html
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs holdings.json history.json metlife-cache.json tdfinfo.json pension.json
          git diff --cached --quiet || { git commit -m "data update"; for i in 1 2 3 4; do git push && break; sleep 20; git pull --rebase -X theirs -q || { git rebase --abort; git fetch -q; git reset -q --soft origin/main; git commit -q -m "data update"; }; done; }
